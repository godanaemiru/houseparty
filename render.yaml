# Render Blueprint: lets Render provision both the web service and a free managed
# Postgres database in one step, wired together automatically.
#
# To use: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file and sets
# everything up — you'll just need to review/confirm the plan and click Apply.
#
# See README.md ("Deploying so friends can join from anywhere") for the full walkthrough.

databases:
  - name: housie-db
    databaseName: housie
    plan: free

services:
  - type: web
    name: housie
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: housie-db
          property: connectionString
      # Optional tuning — safe to leave unset, sensible defaults are baked in.
      # - key: LOG_LEVEL       # pino level: trace|debug|info|warn|error (default: info)
      #   value: info
      # - key: PG_POOL_MAX     # max Postgres pool connections per instance (default: 10)
      #   value: "10"
      # - key: JWT_EXPIRES_IN  # login session lifetime, e.g. 1d/12h/7d (default: 7d)
      #   value: 7d
      # Optional but recommended — TURN relay so users behind symmetric NAT can connect.
      # Set these via the Render dashboard (sync: false keeps secrets out of the repo).
      # - key: TURN_URL
      #   sync: false
      # - key: TURN_USERNAME
      #   sync: false
      # - key: TURN_CREDENTIAL
      #   sync: false
      # Optional — only needed if you're enabling the LiveKit SFU video mode (see README).
      # Uncomment and fill these in via the Render dashboard once you have a LiveKit project.
      # - key: LIVEKIT_URL
      #   sync: false
      # - key: LIVEKIT_API_KEY
      #   sync: false
      # - key: LIVEKIT_API_SECRET
      #   sync: false
